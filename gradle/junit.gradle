dependencies {
	//Junit 5
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
	testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.2'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
	testImplementation files('libs/MinecraftJUnit-1.5.0-deobf.jar')

	testImplementation 'io.hosuaby:inject-resources-junit-jupiter:0.3.2'
	testImplementation 'org.reflections:reflections:0.10.2'

	//Mockito
	testImplementation 'org.mockito:mockito-inline:4.3.1'
	testImplementation 'org.mockito:mockito-core:4.3.1'

	//Curse whoever designed module separation
	testRuntimeOnly "com.elytradev:mirage:2.0.3-rc3-SNAPSHOT"
}

test {
	useJUnitPlatform()

	maxHeapSize = '1G'
	failFast = false
	workingDir = './run_tests'
	mkdir './run_tests'
}